      aliases: []
      permission: 'advancedsky.island.player.accept'
      syntax: ''
      description: 'Accept a pending island invitation'
    reject:
      aliases: []
      permission: 'advancedsky.island.player.reject'
      syntax: ''
      description: 'Reject a pending island invitation'
