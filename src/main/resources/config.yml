# ===================================================================
# AdvancedSky Configuration
#
# Design:
# - `server.name` and `lobby-only`: per-server identity and role
# - everything else: usually the same across all servers in the network
# - an island is created on one island server and stays there forever
# ===================================================================

# ===================================================================
# Server Identity (per-server)
# ===================================================================
server:
  # Must match the server name in your BungeeCord / Velocity config.
  name: "sky1"

# true: commands only; false: hosts islands in the world named after server.name.
# Role and server name are read at startup; restart after changing either.
lobby-only: false


# ===================================================================
# Database
# ===================================================================
# Stores persistent island/player data. Single source of truth, shared by all servers.
mysql:
  host: "localhost"
  port: 3306
  database: "advancedsky"
  username: "root"
  password: "password"

  # Whether to use SSL for the database connection.
  use-ssl: false

  # JDBC properties appended to the connection URL.
  # Format: "key1=value1&key2=value2"
  # socketTimeout bounds a query whose reply never arrives, so a black-holed socket
  # cannot block an async thread indefinitely. Keep it ABOVE the database server's
  # innodb_lock_wait_timeout (50s by default) so a genuine row-lock wait still ends in
  # InnoDB's own error on a reusable connection instead of a killed socket.
  properties: "useUnicode=true&characterEncoding=utf8&connectTimeout=10000&socketTimeout=60000"

  # Table prefix for all plugin tables.
  prefix: "advancedsky_"

# ===================================================================
# Redis
# ===================================================================
# Used for cross-server communication.
redis:
  host: "localhost"
  port: 6379
  password: ""

  # Cross-server messaging uses Redis Streams with per-server inbox keys.

# Servers in the same AdvancedSky network must share this cluster id.
# Use a different id for each independent network sharing Redis.
# Read at startup; changing it requires restarting all nodes in the network.
cluster-id: default


# Servers register their roles in Redis automatically once ready, with a heartbeat every 5s.
# A stopped server unregisters immediately; a crashed server expires within 30s.
# New islands go to the online island server with the fewest islands.
# Node clocks must still agree (run NTP): cross-server requests older than 10s are refused.

# ===================================================================
# Lobby Destination
# ===================================================================
# Where players are sent when they must leave an island forcibly
# (e.g., island delete) or run /island lobby. A ready lobby server is picked at random.
lobby:
  # Lobby world name (must exist on all lobby servers).
  world-name: "world"

  # Spawn location inside the lobby world.
  location:
    x: 0.0
    y: 100.0
    z: 0.0
    yaw: 0.0
    pitch: 0.0


# ===================================================================
# Island
# ===================================================================
island:
  # The island world name is server.name (e.g. sky1). It must already be loaded when the
  # plugin enables. Set level-name in server.properties accordingly; Folia cannot load it later.
  # Y level of the island centre block.
  # Do not change once islands exist: every island position is derived from it.
  height: 100

  # Starter island loaded once at startup from a Sponge .schem v3 file.
  # Path is relative to plugins/AdvancedSky/. Put the same file on every island server.
  # The bundled default is saved to schematics/starter.schem if that file is missing.
  # Existing files are kept; replace the file to use your own starter island.
  # The schematic's copy origin lands on the island centre. Air is skipped; block entity
  # data (including chest contents) is kept. Entities and biomes are not copied.
  # No template world or WorldEdit plugin is needed. Restart after changing the file.
  template:
    schematic: "schematics/starter.schem"

  # Where a new island's default home is, relative to its centre block.
  spawn:
    x: 0.5
    y: 1.0
    z: 0.5
    yaw: 0.0
    pitch: 0.0


# ===================================================================
# Commands
# ===================================================================
command:
  # Default behavior of `/island` when used with no arguments.
  # Options:
  # - "help"   : show help
  # - "island" : teleport to your island home (players without an island get the no-island message)
  base-command-mode: "island"


# ===================================================================
# Debug
# ===================================================================
# If true, prints more detailed logs.
debug: false
